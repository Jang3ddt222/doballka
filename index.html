<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Live Player</title>
    <!-- โหลด hls.js สำหรับเล่นไฟล์ .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }
        .playlist-section {
            padding: 15px;
        }
        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ff9800;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .station-item:hover {
            background: #383838;
        }
        .station-item.active {
            border-left: 4px solid #4caf50;
            background: #2e3b2f;
        }
        .station-item img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 5px;
        }
        .station-info h4 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: #fff;
        }
        .station-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- วิดีโอ HTML5 Player -->
        <video id="video" controls autoplay poster="https://apiv2.allsportsapi.com/logo/141_arsenal.jpg"></video>
        
        <!-- รายการลิงก์ถ่ายทอดสด -->
        <div class="playlist-section">
            <div class="playlist-title">📺 เลือกลิงก์รับชม / ลิงก์สำรอง:</div>
            <div id="playlist"></div>
        </div>
    </div>

    <script>
        // ข้อมูล JSON รวมลิงก์ทั้งหมด
        const playlistData = [
            {
                "name": "อาร์เซน่อล VS ลีดส์ ยูไนเต็ด (ลิงก์หลัก)",
                "info": "⚽ Premier League | 📅 10/10/2026 | ⏰ 18:30",
                "image": "https://apiv2.allsportsapi.com/logo/141_arsenal.jpg",
                "url": "https://messi.damitv.st/live-hls/channel/pl/2026-10-10/ars-lee/playlist.m3u8?tk=AmIOqvE7zRHKqC8TaOjvTw&e=1791676668",
                "referer": "https://messi.damitv.st",
                "userAgent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
            },
            {
                "name": "อาร์เซน่อล VS ลีดส์ ยูไนเต็ด (ลิงก์สำรอง 1)",
                "info": "⚽ Premier League | 📅 10/10/2026 | ⏰ 18:30",
                "image": "https://apiv2.allsportsapi.com/logo/141_arsenal.jpg",
                "url": "https://pulltx.cqsycw.com/live/hd-en-6MwdqQhYozyJA6NSrr.m3u8?txSecret=682bb7ac98274aead052ae4a14bfe87b&txTime=6ACEB1A9",
                "referer": "https://pulltx.cqsycw.com",
                "userAgent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
            }
        ];

        const video = document.getElementById('video');
        const playlistContainer = document.getElementById('playlist');
        let hlsPlayer = null;

        // ฟังก์ชันสำหรับสั่งเล่นวิดีโอตามลิงก์ที่เลือก
        function playStream(station, index) {
            // อัปเดตสถานะ Active ในรายการเลือก
            document.querySelectorAll('.station-item').forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy(); // ทำลายอินสแตนซ์เก่าก่อนเล่นลิงก์ใหม่
                }

                hlsPlayer = new Hls({
                    xhrSetup: function (xhr, url) {
                        try {
                            // พยายามแนบ Referer (ทำงานได้หากรันผ่าน Proxy/สภาพแวดล้อมที่รองรับ)
                            xhr.setRequestHeader('Referer', station.referer);
                        } catch (e) {
                            console.warn("ไม่สามารถตั้งค่า Referer ผ่านหน้าเว็บโดยตรงได้:", e);
                        }
                    }
                });

                hlsPlayer.loadSource(station.url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log("Auto-play blocked:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // สำหรับ Safari / iOS Native Player
                video.src = station.url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }
        }

        // สร้างรายการลิงก์สตรีมมิ่งลงใน HTML
        function renderPlaylist() {
            playlistData.forEach((station, index) => {
                const item = document.createElement('div');
                item.className = `station-item ${index === 0 ? 'active' : ''}`;
                item.onclick = () => playStream(station, index);

                item.innerHTML = `
                    <img src="${station.image}" alt="Logo">
                    <div class="station-info">
                        <h4>${station.name}</h4>
                        <p>${station.info}</p>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });
        }

        // เริ่มต้นการทำงาน (เล่นลิงก์แรกเป็นค่าเริ่มต้น)
        renderPlaylist();
        playStream(playlistData[0], 0);
    </script>

</body>
</html>
