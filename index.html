<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Football Multi-Channel Player</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: Arial, sans-serif;
        }
        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 20px 0;
        }
        .channel-buttons {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
            background: #1e1e1e;
            border-radius: 8px;
        }
        .channel-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        .channel-btn:hover, .channel-btn.active {
            background-color: #e50914;
        }
        video { 
            width: 100%; 
            border-radius: 8px; 
            background: #000; 
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="current-channel">🔴 เลือกช่องถ่ายทอดสด</h2>
        
        <!-- ปุ่มสลับช่องทั้งหมดรวมชุดใหม่ -->
        <div class="channel-buttons">
            <!-- กลุ่มช่องเดิม -->
            <button class="channel-btn active" onclick="changeChannel('http://line.ottcst.net/live/PK5Z3U9BGS/K42HMA3QEJ/1762008.ts', 'ช่องหลัก (1762008.ts)', this)">ช่องหลัก</button>
            <button class="channel-btn" onclick="changeChannel('http://line.ottcst.net/live/PK5Z3U9BGS/K42HMA3QEJ/1562263.ts', 'NOWSPORTS', this)">NOWSPORTS</button>
            <button class="channel-btn" onclick="changeChannel('http://line.ottcst.net/live/PK5Z3U9BGS/K42HMA3QEJ/1562262.ts', 'TNT SPORTS 1', this)">TNT SPORTS 1</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/1133039', '|UK| TNT SPORTS 1 50FPS', this)">TNT 1 (50FPS)</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/644692', '|UK| HubPremier 1', this)">HubPremier 1</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/644691', '|UK| HubPremier 2', this)">HubPremier 2</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/644690', '|UK| HubPremier 3', this)">HubPremier 3</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/644689', '|UK| HubPremier 4', this)">HubPremier 4</button>

            <!-- กลุ่ม Now Sports เพิ่มเติม -->
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439056', '|HK| Now Sports 4K', this)">Now Sports 4K</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439055', '|HK| Now Sports PL 1 FHD', this)">Now PL 1 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439054', '|HK| Now Sports PL 2 FHD', this)">Now PL 2 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439053', '|HK| Now Sports PL 3 FHD', this)">Now PL 3 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439052', '|HK| Now Sports PL 4 FHD', this)">Now PL 4 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439051', '|HK| Now Sports PL 5 FHD', this)">Now PL 5 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439050', '|HK| Now Sports PL 6 FHD', this)">Now PL 6 FHD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439049', '|HK| Now Sports 1 HD', this)">Now Sports 1 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439048', '|HK| Now Sports 2 HD', this)">Now Sports 2 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439047', '|HK| Now Sports 3 HD', this)">Now Sports 3 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439046', '|HK| Now Sports 4 HD', this)">Now Sports 4 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439045', '|HK| Now Sports 5 HD', this)">Now Sports 5 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439044', '|HK| Now Sports 6 HD', this)">Now Sports 6 HD</button>
            <button class="channel-btn" onclick="changeChannel('http://supportott.ottc.pro:80/Barhana-mustax/BQ8IK1CALA/439043', '|HK| Now Sports 7 HD', this)">Now Sports 7 HD</button>

            <!-- กลุ่ม beIN Sports 4K -->
            <button class="channel-btn" onclick="changeChannel('http://a1.24tv.tn:2052/2482959335691767/427683010928794/354256', 'beIN SPORTS 4K', this)">beIN 4K</button>
            <button class="channel-btn" onclick="changeChannel('http://a1.24tv.tn:2052/2482959335691767/427683010928794/354258', 'beIN SPORTS 4K 1', this)">beIN 4K 1</button>
            <button class="channel-btn" onclick="changeChannel('http://a1.24tv.tn:2052/2482959335691767/427683010928794/354260', 'beIN SPORTS 4K 3', this)">beIN 4K 3</button>
        </div>

        <!-- Video Element -->
        <video id="videoElement" controls autoplay></video>
    </div>

    <!-- โหลดไลบรารี mpegts.js -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.js"></script>
    <script>
        let player = null;
        const videoElement = document.getElementById('videoElement');

        function playStream(url) {
            if (mpegts.getFeatureList().mseLivePlayback) {
                // ทำลาย Player ตัวเก่าทิ้งก่อนเปิดช่องใหม่
                if (player !== null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }

                player = mpegts.createPlayer({
                    type: 'mpegts', 
                    isLive: true,
                    url: url
                });
                
                player.attachMediaElement(videoElement);
                player.load();
                player.play().catch(error => {
                    console.log("Autoplay ถูกบล็อก:", error);
                });
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับ mpegts.js");
            }
        }

        function changeChannel(url, name, btnElement) {
            // เปลี่ยนข้อความหัวข้อ
            document.getElementById('current-channel').innerText = '🔴 กำลังสตรีม: ' + name;
            
            // สลับสถานะปุ่ม Active
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // เริ่มเล่นสตรีมช่องใหม่
            playStream(url);
        }

        // เริ่มต้นเปิดช่องแรกอัตโนมัติ
        playStream('http://line.ottcst.net/live/PK5Z3U9BGS/K42HMA3QEJ/1762008.ts');
    </script>

</body>
</html>
